<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运行监控 - SAMP</title>
  <script>
    document.documentElement.setAttribute(
      "data-theme",
      localStorage.getItem("samp_theme") === "precision-dark" ? "precision-dark" : "minimalist-light"
    );
  </script>
  <link rel="stylesheet" href="/static/samp.css">
</head>
<body data-title-key="page.title.runtime">
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/definitions"><span class="brand-mark">S</span><span>SAMP</span></a>
      <nav class="nav">
        <a href="/definitions" data-i18n="nav.definitions">采样定义</a>
        <a class="active" href="/runtime" data-i18n="nav.runtime">运行监控</a>
        <a href="/query" data-i18n="nav.query">采样查询</a>
      </nav>
    </div>
    <div class="topbar-right">
      <button type="button" id="theme-toggle" class="icon-btn" data-i18n-title="theme.toggle"></button>
      <select id="lang-select" class="select-ctrl ctrl-sm" data-i18n-title="lang.label">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
        <option value="ru-RU">Русский</option>
      </select>
    </div>
  </header>

  <section class="metric-strip">
    <div class="metric-item"><span class="dot" id="rt-dot"></span><span class="metric-label" data-i18n="metric.scheduler">调度</span><span class="metric-val" id="rt-sched">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.enabled">启用</span><span class="metric-val" id="rt-enabled">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.auto">自动</span><span class="metric-val" id="rt-auto">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.sampled">成功</span><span class="metric-val ok" id="rt-ok">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.failed">失败</span><span class="metric-val" id="rt-fail">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.last_cycle">检查</span><span class="metric-val" id="rt-cycle">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.total_size">占用</span><span class="metric-val" id="rt-size">--</span></div>
  </section>

  <main class="workspace">
    <section class="panel grow">
      <div class="toolbar">
        <div class="toolbar-group">
          <div class="tabs" id="rt-tabs">
            <button type="button" class="tab-btn active" data-tab="status" data-i18n="rt.tab_status">运行状态</button>
            <button type="button" class="tab-btn" data-tab="logs" data-i18n="rt.tab_logs">执行日志</button>
            <button type="button" class="tab-btn" data-tab="storage" data-i18n="rt.tab_storage">结果库管理</button>
          </div>
          <select id="log-filter" class="select-ctrl hidden">
            <option value="all" data-i18n="filter.all_logs">全部日志</option>
            <option value="ok" data-i18n="filter.only_ok">仅成功</option>
            <option value="error" data-i18n="filter.only_error">仅失败</option>
          </select>
        </div>
        <div class="toolbar-group">
          <button type="button" id="btn-sample-all" class="btn primary" data-i18n="action.sample_all">全部采样</button>
          <button type="button" id="btn-refresh" class="btn" data-i18n="action.refresh">刷新</button>
        </div>
      </div>

      <!-- Tab 1: 单点运行状态 -->
      <div class="table-scroll" id="pane-status">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="col.name">采样点</th>
              <th data-i18n="col.status">状态</th>
              <th class="num" data-i18n="col.interval">周期</th>
              <th data-i18n="col.source_table">源表</th>
              <th data-i18n="col.years">年份</th>
              <th class="num" data-i18n="col.rows">行数</th>
              <th class="num" data-i18n="col.size">体积</th>
              <th class="num" data-i18n="col.last_run">最近采样</th>
              <th class="num" data-i18n="col.next_run">下次触发</th>
              <th class="num" data-i18n="col.duration">耗时(ms)</th>
              <th data-i18n="col.last_msg">结果 / 异常</th>
              <th data-i18n="col.actions">操作</th>
            </tr>
          </thead>
          <tbody id="status-tbody">
            <tr><td colspan="12" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Tab 2: 执行日志 -->
      <div class="table-scroll hidden" id="pane-logs">
        <table class="data-table">
          <thead>
            <tr>
              <th class="num" data-i18n="col.time">时间</th>
              <th data-i18n="col.name">采样点</th>
              <th data-i18n="col.trigger">触发</th>
              <th data-i18n="col.status">状态</th>
              <th class="num" data-i18n="col.rows">行数</th>
              <th class="num" data-i18n="col.duration">耗时(ms)</th>
              <th data-i18n="col.last_msg">结果 / 异常</th>
            </tr>
          </thead>
          <tbody id="logs-tbody">
            <tr><td colspan="7" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Tab 3: 结果库管理 -->
      <div class="table-scroll hidden" id="pane-storage">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="col.filename">文件名</th>
              <th data-i18n="col.name">采样点</th>
              <th class="num" data-i18n="col.year">年份</th>
              <th class="num" data-i18n="col.rows">行数</th>
              <th class="num" data-i18n="col.size">体积</th>
              <th data-i18n="col.time_range">时间跨度</th>
              <th data-i18n="col.rtdb">RTDB</th>
              <th data-i18n="col.status">状态</th>
              <th data-i18n="col.actions">操作</th>
            </tr>
          </thead>
          <tbody id="storage-tbody">
            <tr><td colspan="9" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/static/i18n.js"></script>
<script src="/static/common.js"></script>
<script src="/static/runtime.js"></script>
</body>
</html>
