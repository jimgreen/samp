<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运行监控 - SAMP</title>
  <script>
    (function(){
      var t = localStorage.getItem("samp_theme");
      var ok = ["minimalist-light","precision-dark","bento-grid","glassmorphism","editorial","sci-fi-cyan","sci-fi-purple","sci-fi-matrix"];
      document.documentElement.setAttribute("data-theme", ok.indexOf(t) >= 0 ? t : "minimalist-light");
    })();
  </script>
  <link rel="stylesheet" href="/static/samp.css">
</head>
<body data-title-key="page.title.runtime">
<div class="app-shell" id="app-shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="/definitions"><span class="brand-mark">S</span><span>SAMP</span></a>
      <button type="button" class="btn ghost xs icon-only" data-sidebar-toggle data-i18n-title="sidebar.toggle">
        <svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><polyline points="15 9 12 12 15 15"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="/definitions" data-i18n-title="nav.definitions">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        <span data-i18n="nav.definitions">采样定义</span>
      </a>
      <a class="active" href="/runtime" data-i18n-title="nav.runtime">
        <svg class="ico" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span data-i18n="nav.runtime">运行监控</span>
      </a>
      <a href="/query" data-i18n-title="nav.query">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span data-i18n="nav.query">采样查询</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-resizer" id="sidebar-resizer" data-i18n-title="sidebar.resize"></div>

  <div class="main-column">
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="btn ghost xs icon-only" id="btn-sidebar-toggle" data-sidebar-toggle data-i18n-title="sidebar.toggle">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <span class="page-heading" data-i18n="nav.runtime">运行监控</span>
    </div>
    <div class="topbar-right">
      <button type="button" id="alarm-pill" class="alarm-pill hidden"></button>
      <select id="theme-select" class="select-ctrl ctrl-sm" data-i18n-title="theme.toggle">
        <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
        <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
        <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
        <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
        <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
        <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻电光青</option>
        <option value="sci-fi-purple" data-i18n="theme.purple">科幻赛博紫</option>
        <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻矩阵绿</option>
      </select>
      <select id="lang-select" class="select-ctrl ctrl-sm" data-i18n-title="lang.label">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
        <option value="ru-RU">Русский</option>
      </select>
    </div>
  </header>

  <section class="metric-strip">
    <div class="metric-item"><span class="dot" id="rt-dot"></span><span class="metric-label" data-i18n="metric.scheduler">调度</span><span class="metric-val" id="rt-sched">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.enabled">启用</span><span class="metric-val" id="rt-enabled">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.auto">自动</span><span class="metric-val" id="rt-auto">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.sampled">成功</span><span class="metric-val ok" id="rt-ok">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.failed">失败</span><span class="metric-val" id="rt-fail">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.last_cycle">检查</span><span class="metric-val" id="rt-cycle">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.total_size">占用</span><span class="metric-val" id="rt-size">--</span></div>
  </section>

  <main class="workspace">
    <section class="panel grow">
      <div class="toolbar">
        <div class="toolbar-group">
          <div class="tabs" id="rt-tabs">
            <button type="button" class="tab-btn active" data-tab="status" data-i18n="rt.tab_status">运行状态</button>
            <button type="button" class="tab-btn" data-tab="logs" data-i18n="rt.tab_logs">执行日志</button>
            <button type="button" class="tab-btn" data-tab="storage" data-i18n="rt.tab_storage">结果库管理</button>
          </div>
          <select id="status-filter" class="select-ctrl">
            <option value="all" data-i18n="rt.filter_all">全部</option>
            <option value="error" data-i18n="rt.filter_error">仅异常</option>
            <option value="periodic" data-i18n="rt.filter_periodic">周期</option>
            <option value="fixed" data-i18n="rt.filter_fixed">定点</option>
            <option value="trigger" data-i18n="rt.filter_trigger">触发</option>
            <option value="manual" data-i18n="rt.filter_manual">手动</option>
          </select>
          <select id="log-filter" class="select-ctrl hidden">
            <option value="all" data-i18n="filter.all_logs">全部日志</option>
            <option value="ok" data-i18n="filter.only_ok">仅成功</option>
            <option value="error" data-i18n="filter.only_error">仅失败</option>
          </select>
        </div>
        <div class="toolbar-group">
          <button type="button" id="btn-sample-all" class="btn primary">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            <span data-i18n="action.sample_all">全部采样</span>
          </button>
          <button type="button" id="btn-refresh" class="btn">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            <span data-i18n="action.refresh">刷新</span>
          </button>
        </div>
      </div>

      <!-- 近 50 次执行趋势 Sparkline 紧凑条 -->
      <div class="spark-strip" id="spark-strip">
        <span class="spark-title" data-i18n="rt.spark_title">近 50 次</span>
        <canvas id="spark-canvas" class="spark-canvas"></canvas>
        <span class="spark-meta" id="spark-meta">—</span>
      </div>

      <!-- Tab 1: 单点运行状态 -->
      <div class="table-scroll" id="pane-status">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="col.name">采样点</th>
              <th data-i18n="col.status">状态</th>
              <th data-i18n="col.start_mode">启动方式</th>
              <th data-i18n="col.source_table">源表</th>
              <th data-i18n="col.years">年份</th>
              <th class="num" data-i18n="col.rows">行数</th>
              <th class="num" data-i18n="col.size">体积</th>
              <th class="num" data-i18n="col.last_run">最近采样</th>
              <th class="num" data-i18n="col.next_run">下次触发</th>
              <th class="num" data-i18n="col.duration">耗时(ms)</th>
              <th data-i18n="col.last_msg">结果 / 异常</th>
              <th class="sticky-actions" data-i18n="col.actions">操作</th>
            </tr>
          </thead>
          <tbody id="status-tbody">
            <tr><td colspan="12" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Tab 2: 执行日志 -->
      <div class="table-scroll hidden" id="pane-logs">
        <table class="data-table">
          <thead>
            <tr>
              <th class="num" data-i18n="col.time">时间</th>
              <th data-i18n="col.name">采样点</th>
              <th data-i18n="col.trigger">触发</th>
              <th data-i18n="col.status">状态</th>
              <th class="num" data-i18n="col.rows">行数</th>
              <th class="num" data-i18n="col.duration">耗时(ms)</th>
              <th data-i18n="col.last_msg">结果 / 异常</th>
            </tr>
          </thead>
          <tbody id="logs-tbody">
            <tr><td colspan="7" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Tab 3: 结果库管理 -->
      <div class="table-scroll hidden" id="pane-storage">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="col.filename">文件名</th>
              <th data-i18n="col.name">采样点</th>
              <th class="num" data-i18n="col.year">年份</th>
              <th class="num" data-i18n="col.rows">行数</th>
              <th class="num" data-i18n="col.size">体积</th>
              <th data-i18n="col.time_range">时间跨度</th>
              <th data-i18n="col.rtdb">RTDB</th>
              <th data-i18n="col.status">状态</th>
              <th class="sticky-actions" data-i18n="col.actions">操作</th>
            </tr>
          </thead>
          <tbody id="storage-tbody">
            <tr><td colspan="9" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  </div>
</div>

<!-- 结果库在线透视模态框 -->
<div class="modal-backdrop" id="inspect-db-backdrop">
  <div class="modal modal-accent modal-wide" role="dialog" aria-modal="true">
    <div class="modal-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span id="inspect-db-title" class="mono">—</span>
      <span id="inspect-db-meta" class="mono text-muted" style="font-size:11px;font-weight:500">—</span>
    </div>
    <div class="modal-body">
      <div class="inspect-tabs" id="inspect-db-tables"></div>
      <div class="inspect-cols" id="inspect-db-cols"></div>
      <div class="inspect-table-wrap" id="inspect-db-wrap"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" id="inspect-db-close" data-i18n="action.close">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/i18n.js"></script>
<script src="/static/common.js"></script>
<script src="/static/runtime.js"></script>
</body>
</html>
