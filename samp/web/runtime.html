<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>运行监控 - SAMP</title><link rel='stylesheet' href='/static/samp.css'></head><body><header><h1>SAMP 采样服务</h1><p>查看自动采样调度状态和结果写入情况</p><nav class='nav'><a href='/definitions'>采样定义</a><a class='active' href='/runtime'>运行监控</a><a href='/query'>采样查询</a></nav></header><main class='page'><div class='toolbar'><h2>自动采样运行监控</h2><div><button id='sample-all' class='btn primary'>立即执行已启用</button><button id='refresh-runtime' class='btn'>刷新状态</button></div></div><div id='runtime-metrics' class='status-row'></div><div id='scheduler-info' class='notice info'>正在读取调度器状态…</div><div class='card'><div id='runtime-table' class='table-wrap'></div></div></main><div id='toast' class='toast'></div><script src='/static/common.js'></script><script>
let definitions=[];function renderMetrics(){const enabled=definitions.filter(d=>d.enabled).length;$('runtime-metrics').innerHTML=`<div class='metric'><b>${definitions.length}</b><span>采样定义</span></div><div class='metric'><b>${enabled}</b><span>已启用</span></div><div class='metric'><b>${definitions.filter(d=>d.interval_seconds>0&&d.enabled).length}</b><span>自动采样</span></div>`}
function renderScheduler(scheduler){const cycle=scheduler.last_cycle_at?new Date(scheduler.last_cycle_at*1000).toLocaleString():'尚未运行',success=scheduler.last_success_at?new Date(scheduler.last_success_at*1000).toLocaleString():'暂无成功记录';$('scheduler-info').textContent=`后台调度正常 · 最近检查：${cycle} · 最近成功：${success} · 成功 ${scheduler.sampled||0} 次 · 失败 ${scheduler.failed||0} 次${scheduler.last_error?` · 最近错误：${scheduler.last_error}`:''}`;$('scheduler-info').className=scheduler.failed?'notice error':'notice info'}
async function loadRuntime(){try{const [defs,health]=await Promise.all([api('/api/definitions'),api('/api/health')]);definitions=defs;renderMetrics();renderScheduler(health.scheduler||{});if(!definitions.length){$('runtime-table').innerHTML='<div class="empty">暂无运行对象</div>';return}$('runtime-table').innerHTML=`<table class='data-table'><thead><tr><th>采样点</th><th>状态</th><th>周期</th><th>源表</th><th>结果年份</th><th>最近结果</th><th>操作</th></tr></thead><tbody>${definitions.map(d=>`<tr id='runtime-${d.id}'><td>${esc(d.samp_name)}</td><td>${d.enabled?'<span class="badge on">启用</span>':'<span class="badge off">停用</span>'}</td><td>${d.interval_seconds?d.interval_seconds+' 秒':'手动'}</td><td>${esc(d.source_table)}</td><td class='runtime-years'>读取中</td><td class='runtime-last'>读取中</td><td><button class='btn small' data-action='runtime-sample' data-id='${d.id}'>立即采样</button></td></tr>`).join('')}</tbody></table>`;await Promise.all(definitions.map(loadRuntimeRow))}catch(error){toast(error.message,true)}}
async function loadRuntimeRow(def){try{const data=await api(`/api/definitions/${def.id}/runtime`),row=$(`runtime-${def.id}`);if(!row)return;row.querySelector('.runtime-years').textContent=data.result_years.length?data.result_years.join(', '):'暂无';row.querySelector('.runtime-last').textContent=data.last_result_at?new Date(data.last_result_at*1000).toLocaleString():'暂无'}catch(error){}}
async function sampleAll(){const button=$('sample-all');button.disabled=true;try{const result=await api('/api/sample/all',{method:'POST'});toast(`批量采样完成：成功 ${result.completed.length} 个，失败 ${result.failed.length} 个`,result.failed.length>0);await loadRuntime()}catch(error){toast(error.message,true)}finally{button.disabled=false}}
async function sampleNow(id){try{const result=await api(`/api/sample/${id}`,{method:'POST'});toast(`采样完成，写入 ${result.rows_written} 行`);await loadRuntime()}catch(error){toast(error.message,true)}}
$('sample-all').addEventListener('click',sampleAll);$('refresh-runtime').addEventListener('click',loadRuntime);$('runtime-table').addEventListener('click',event=>{const button=event.target.closest('[data-action="runtime-sample"]');if(button)sampleNow(Number(button.dataset.id))});loadRuntime();setInterval(loadRuntime,15000);
</script></body></html>
