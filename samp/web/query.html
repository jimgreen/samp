<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采样查询 - SAMP</title>
  <script>
    (function(){
      var t = localStorage.getItem("samp_theme");
      var ok = ["minimalist-light","precision-dark","bento-grid","glassmorphism","editorial","sci-fi-cyan","sci-fi-purple","sci-fi-matrix"];
      document.documentElement.setAttribute("data-theme", ok.indexOf(t) >= 0 ? t : "minimalist-light");
    })();
  </script>
  <link rel="stylesheet" href="/static/samp.css">
</head>
<body data-title-key="page.title.query">
<div class="app-shell" id="app-shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="/definitions"><span class="brand-mark">S</span><span>SAMP</span></a>
      <button type="button" class="btn ghost xs icon-only" data-sidebar-toggle data-i18n-title="sidebar.toggle">
        <svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><polyline points="15 9 12 12 15 15"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="/definitions" data-i18n-title="nav.definitions">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        <span data-i18n="nav.definitions">采样定义</span>
      </a>
      <a href="/runtime" data-i18n-title="nav.runtime">
        <svg class="ico" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span data-i18n="nav.runtime">运行监控</span>
      </a>
      <a class="active" href="/query" data-i18n-title="nav.query">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span data-i18n="nav.query">采样查询</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-resizer" id="sidebar-resizer" data-i18n-title="sidebar.resize"></div>

  <div class="main-column">
  <header class="topbar">
    <div class="topbar-left">
      <button type="button" class="btn ghost xs icon-only" id="btn-sidebar-toggle" data-sidebar-toggle data-i18n-title="sidebar.toggle">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <span class="page-heading" data-i18n="nav.query">采样查询</span>
    </div>
    <div class="topbar-right">
      <button type="button" id="alarm-pill" class="alarm-pill hidden"></button>
      <select id="theme-select" class="select-ctrl ctrl-sm" data-i18n-title="theme.toggle">
        <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
        <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
        <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
        <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
        <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
        <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻电光青</option>
        <option value="sci-fi-purple" data-i18n="theme.purple">科幻赛博紫</option>
        <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻矩阵绿</option>
      </select>
      <select id="lang-select" class="select-ctrl ctrl-sm" data-i18n-title="lang.label">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
        <option value="ru-RU">Русский</option>
      </select>
    </div>
  </header>

  <main class="workspace">
    <section class="panel panel-overflow">
      <div class="toolbar">
        <div class="toolbar-group">
          <select id="q-def" class="select-ctrl" style="min-width:116px"></select>
          <select id="q-item" class="select-ctrl mono hidden" style="min-width:116px"></select>
          <div class="multi-select" id="key-picker">
            <button type="button" class="btn multi-trigger" id="key-trigger">
              <span id="key-trigger-text" data-i18n="filter.all_keys">全部 row_key</span>
              <svg class="ico ico-xs" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="multi-menu" id="key-menu">
              <div class="multi-menu-head">
                <input type="text" id="key-search" class="ctrl" data-i18n-placeholder="q.search_key" placeholder="筛选 row_key">
                <button type="button" class="btn xs" id="key-all" data-i18n="action.select_all">全选</button>
                <button type="button" class="btn xs" id="key-none" data-i18n="action.clear">清空</button>
              </div>
              <div class="multi-menu-list" id="key-list"></div>
            </div>
          </div>
          <input id="q-start" type="datetime-local" step="1" class="ctrl ctrl-dt">
          <span class="text-muted">~</span>
          <input id="q-end" type="datetime-local" step="1" class="ctrl ctrl-dt">
          <div class="chip-row" id="q-ranges">
            <button type="button" class="btn xs" data-range="15m" data-i18n="q.range_15m">15m</button>
            <button type="button" class="btn xs" data-range="hour" data-i18n="q.range_1h">1h</button>
            <button type="button" class="btn xs" data-range="today" data-i18n="q.range_today">今日</button>
            <button type="button" class="btn xs" data-range="day" data-i18n="q.range_24h">24h</button>
            <button type="button" class="btn xs" data-range="7d" data-i18n="q.range_7d">7d</button>
          </div>
        </div>
        <div class="toolbar-group">
          <select id="q-snap-time" class="select-ctrl mono" style="max-width:162px">
            <option value="" data-i18n="q.all_times">全部时刻</option>
          </select>
          <label class="diff-chip disabled" id="q-diff-wrap">
            <input type="checkbox" id="q-diff-prev" disabled>
            <span data-i18n="q.diff_prev">对比上一时刻</span>
          </label>
          <span class="badge warn hidden" id="q-diff-badge"></span>
          <div class="tabs" id="q-view-modes">
            <button type="button" class="tab-btn active" data-view="split" data-i18n="q.view_split">图+表</button>
            <button type="button" class="tab-btn" data-view="table" data-i18n="q.view_table">仅整表</button>
            <button type="button" class="tab-btn" data-view="chart" data-i18n="q.view_chart">仅曲线</button>
          </div>
          <select id="q-agg" class="select-ctrl">
            <option value="avg" data-i18n="q.agg_avg">均值聚合</option>
            <option value="raw" data-i18n="q.agg_raw">原始点</option>
            <option value="max" data-i18n="q.agg_max">最大值</option>
            <option value="min" data-i18n="q.agg_min">最小值</option>
            <option value="last" data-i18n="q.agg_last">最新值</option>
          </select>
          <select id="q-order" class="select-ctrl">
            <option value="desc" data-i18n="q.order_desc">最新优先</option>
            <option value="asc" data-i18n="q.order_asc">时间升序</option>
          </select>
          <select id="q-auto" class="select-ctrl">
            <option value="0" data-i18n="q.auto_off">实时:关</option>
            <option value="5" data-i18n="q.auto_5s">实时:5s</option>
            <option value="15" data-i18n="q.auto_15s">实时:15s</option>
          </select>
          <button type="button" id="btn-query" class="btn primary">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span data-i18n="action.query">查询</span>
          </button>
          <button type="button" id="btn-export" class="btn">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span data-i18n="action.export_csv">导出 CSV</span>
          </button>
        </div>
      </div>

      <div class="field-bar">
        <div class="chip-row">
          <input id="q-field-search" class="ctrl ctrl-sm" style="width:94px" data-i18n-placeholder="def.ph_field_search" placeholder="筛选字段">
          <button type="button" id="q-fields-num" class="btn xs" data-i18n="action.numeric_only">仅数值列</button>
          <button type="button" id="q-fields-all" class="btn xs" data-i18n="action.select_all">全选</button>
          <button type="button" id="q-fields-none" class="btn xs" data-i18n="action.clear">清空</button>
        </div>
        <div id="q-fields" class="chip-row q-fields-scroll"></div>
        <span class="mono text-muted" id="q-meta">—</span>
      </div>
    </section>

    <section class="query-split" id="query-split">
      <div class="panel">
        <div class="chart-panel-head">
          <div class="chart-legend" id="chart-legend"></div>
          <div class="toolbar-group">
            <span class="mono text-muted" id="chart-meta"></span>
            <input id="q-ref-low" type="number" step="any" class="ctrl ref-input" data-i18n-placeholder="q.ref_low" placeholder="下限">
            <input id="q-ref-high" type="number" step="any" class="ctrl ref-input" data-i18n-placeholder="q.ref_high" placeholder="上限">
            <div class="tabs" id="chart-modes">
              <button type="button" class="tab-btn active" data-mode="shared" data-i18n="q.mode_shared">同轴</button>
              <button type="button" class="tab-btn" data-mode="normalized" data-i18n="q.mode_norm">归一化</button>
              <button type="button" class="tab-btn" data-mode="stacked" data-i18n="q.mode_stacked">分轨</button>
            </div>
            <button type="button" id="btn-export-png" class="btn xs" data-i18n="action.export_png">导出 PNG</button>
            <button type="button" id="btn-reset-zoom" class="btn xs" data-i18n="action.reset_zoom">重置缩放</button>
          </div>
        </div>
        <div class="chart-stage">
          <canvas id="trend-canvas"></canvas>
        </div>
        <div class="chart-stats-bar" id="chart-stats">—</div>
      </div>

      <div class="panel">
        <div class="table-scroll" id="q-table-wrap">
          <table class="data-table clickable-rows">
            <thead id="q-thead"></thead>
            <tbody id="q-tbody"><tr><td class="empty-cell">—</td></tr></tbody>
          </table>
        </div>
        <div class="pager-bar">
          <div class="toolbar-group">
            <input id="q-row-search" type="search" class="ctrl ctrl-sm ctrl-search" style="width:140px" data-i18n-placeholder="q.search_rows" placeholder="筛选行">
            <select id="q-limit" class="select-ctrl ctrl-sm">
              <option value="100">100</option>
              <option value="500" selected>500</option>
              <option value="1000">1000</option>
              <option value="5000">5000</option>
            </select>
            <span class="mono text-muted" id="q-page-info">—</span>
          </div>
          <div class="toolbar-group">
            <button type="button" id="q-prev" class="btn xs" disabled data-i18n="action.prev">上一页</button>
            <button type="button" id="q-next" class="btn xs" disabled data-i18n="action.next">下一页</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/i18n.js"></script>
<script src="/static/common.js"></script>
<script src="/static/chart.js"></script>
<script src="/static/query.js"></script>
</body>
</html>
