<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>采样查询 - SAMP</title><link rel='stylesheet' href='/static/samp.css'></head><body><header><h1>SAMP 采样服务</h1><p>按采样点、时间范围和字段查询历史结果</p><nav class='nav'><a href='/definitions'>采样定义</a><a href='/runtime'>运行监控</a><a class='active' href='/query'>采样查询</a></nav></header><main class='page'><div class='toolbar'><h2>采样结果查询</h2><button id='refresh-query' class='btn'>刷新定义</button></div><div class='card'><div class='query-options'><div class='field'><label>采样点</label><select id='query-definition'></select></div><div class='field'><label>开始时间</label><input id='query-start' type='datetime-local'></div><div class='field'><label>结束时间</label><input id='query-end' type='datetime-local'></div><div class='field page-size'><label>每页行数</label><select id='query-limit'><option value='100'>100</option><option value='500' selected>500</option><option value='1000'>1000</option><option value='5000'>5000</option></select></div><button id='run-query' class='btn primary'>查询</button><button id='export-query' class='btn'>导出当前页</button></div><div class='actions'><button id='query-last-hour' class='btn small'>最近 1 小时</button><button id='query-today' class='btn small'>今天</button><button id='query-last-day' class='btn small'>最近 24 小时</button></div><div class='field'><label>查询字段 <span class='muted'>（可多选）</span></label><div class='actions compact'><button type='button' id='query-fields-all' class='btn small'>全选</button><button type='button' id='query-fields-none' class='btn small'>清空</button></div><div id='query-fields' class='field-list'></div></div><div id='query-message' class='muted'>请选择采样点和时间范围。</div></div><div class='card' style='margin-top:18px'><div id='query-table' class='table-wrap'></div><div class='actions'><button id='query-prev' class='btn small'>上一页</button><span id='query-page-info' class='muted'>未查询</span><button id='query-next' class='btn small'>下一页</button></div><div id='query-chart' class='chart'></div></div></main><div id='toast' class='toast'></div><script src='/static/common.js'></script><script>
const state={definitions:[],lastQuery:null,queryPage:0,queryLimit:500,queryRequest:null};function setDefaultQueryTimes(){const now=Math.floor(Date.now()/1000);$('query-start').value=localDate(now-3600);$('query-end').value=localDate(now)}function setQueryRange(kind){const now=Math.floor(Date.now()/1000),start=new Date();if(kind==='hour'){$('query-start').value=localDate(now-3600);$('query-end').value=localDate(now);return}if(kind==='day'){$('query-start').value=localDate(now-86400);$('query-end').value=localDate(now);return}start.setHours(0,0,0,0);$('query-start').value=localDate(start.getTime()/1000);$('query-end').value=localDate(now)}
function renderDefinitions(){const current=$('query-definition').value,currentFields=checkedFields($('query-fields'));$('query-definition').innerHTML=state.definitions.map(d=>`<option value='${d.id}'>${esc(d.samp_name)}</option>`).join('');const selected=state.definitions.find(d=>String(d.id)===String(current))||state.definitions[0];if(selected){$('query-definition').value=selected.id;renderFieldChecks($('query-fields'),selected.fields,String(selected.id)===String(current)&&currentFields.length?currentFields:selected.fields)}else $('query-fields').innerHTML='<span class="muted">暂无采样定义</span>'}
async function loadDefinitions(){try{state.definitions=await api('/api/definitions');renderDefinitions()}catch(error){toast(error.message,true)}}
function queryRequestFromForm(){const id=$('query-definition').value,start=timestamp($('query-start').value),end=timestamp($('query-end').value),fields=checkedFields($('query-fields'));if(!id){toast('请先创建采样定义',true);return null}if(!Number.isFinite(start)||!Number.isFinite(end)||end<start){toast('请检查查询时间范围',true);return null}if(!fields.length){toast('至少选择一个查询字段',true);return null}return{id,start,end,fields}}
function renderPager(result){const total=Number(result.total_rows||0),offset=Number(result.offset||0),limit=Number(result.limit||state.queryLimit),page=total?Math.floor(offset/limit)+1:0,pages=total?Math.ceil(total/limit):0;$('query-page-info').textContent=total?`第 ${page} / ${pages} 页（${offset+1}-${Math.min(offset+(result.rows||[]).length,total)}，共 ${total} 行）`:'暂无数据';$('query-prev').disabled=page<=1;$('query-next').disabled=!total||page>=pages}
function renderQuery(result){const cols=result.columns||[];if(!result.rows.length){$('query-table').innerHTML='<div class="empty">时间范围内没有采样数据。</div>';$('query-chart').innerHTML='<div class="empty">暂无统计摘要</div>';renderPager(result);return}$('query-table').innerHTML=`<table class='data-table'><thead><tr>${cols.map(c=>`<th>${esc(c==='sample_time'?'采样时间':c)}</th>`).join('')}</tr></thead><tbody>${result.rows.map(row=>`<tr>${cols.map(c=>`<td>${esc(c==='sample_time'?new Date(row[c]*1000).toLocaleString():row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;const fields=cols.filter(c=>!['sample_time','row_key'].includes(c));const cards=fields.map(field=>{const values=result.rows.map(row=>row[field]).filter(value=>value!==null&&value!==undefined&&value!=='');const numbers=values.map(Number).filter(Number.isFinite);if(numbers.length===values.length&&numbers.length)return `<div class='metric'><b>${esc(Math.max(...numbers))}</b><span>${esc(field)} · 最大</span><div class='muted'>最小 ${esc(Math.min(...numbers))} · 最新 ${esc(values[values.length-1])}</div></div>`;return `<div class='metric'><b>${esc(values[values.length-1]??'暂无')}</b><span>${esc(field)} · 最新</span><div class='muted'>共 ${values.length} 个非空值</div></div>`}).join('');$('query-chart').innerHTML=`<div class='muted' style='margin-bottom:8px'>当前页字段统计（${result.rows.length} 行）</div><div class='status-row'>${cards||'<span class="muted">没有可统计字段。</span>'}</div>`;renderPager(result)}
async function runQuery(page=0,useSaved=false){const request=useSaved?state.queryRequest:queryRequestFromForm();if(!request)return;state.queryPage=Math.max(0,page);if(!useSaved)state.queryRequest=request;try{const result=await api(`/api/query/${request.id}?start=${request.start}&end=${request.end}&fields=${encodeURIComponent(request.fields.join(','))}&limit=${state.queryLimit}&offset=${state.queryPage*state.queryLimit}`);state.lastQuery=result;renderQuery(result);$('query-message').textContent=`查询到 ${result.total_rows} 行，当前显示 ${result.rows.length} 行；结果表：${result.tables.join(', ')||'暂无'}`}catch(error){toast(error.message,true)}}
function exportQuery(){const result=state.lastQuery;if(!result?.rows?.length){toast('没有可导出的查询数据',true);return}const csv=[result.columns,...result.rows.map(row=>result.columns.map(col=>row[col]))].map(row=>row.map(value=>`"${String(value??'').replaceAll('"','""')}"`).join(',')).join('\n'),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([`\ufeff${csv}`],{type:'text/csv;charset=utf-8'}));link.download=`${result.definition.samp_name}_采样结果.csv`;link.click();URL.revokeObjectURL(link.href)}
$('refresh-query').addEventListener('click',loadDefinitions);$('run-query').addEventListener('click',()=>runQuery());$('export-query').addEventListener('click',exportQuery);$('query-definition').addEventListener('change',()=>{state.queryPage=0;state.queryRequest=null;const def=state.definitions.find(item=>String(item.id)===$('query-definition').value);if(def)renderFieldChecks($('query-fields'),def.fields,def.fields)});$('query-limit').addEventListener('change',()=>{state.queryLimit=Number($('query-limit').value)||500;state.queryPage=0;if(state.queryRequest)runQuery()});$('query-fields-all').addEventListener('click',()=>setAllFields($('query-fields'),true));$('query-fields-none').addEventListener('click',()=>setAllFields($('query-fields'),false));$('query-prev').addEventListener('click',()=>{if(state.queryPage>0)runQuery(state.queryPage-1,true)});$('query-next').addEventListener('click',()=>{if(state.lastQuery&&state.lastQuery.offset+state.lastQuery.rows.length<state.lastQuery.total_rows)runQuery(state.queryPage+1,true)});$('query-last-hour').addEventListener('click',()=>{setQueryRange('hour');runQuery()});$('query-last-day').addEventListener('click',()=>{setQueryRange('day');runQuery()});$('query-today').addEventListener('click',()=>{setQueryRange('today');runQuery()});setDefaultQueryTimes();loadDefinitions();
</script></body></html>
