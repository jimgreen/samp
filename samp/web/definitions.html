<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>采样定义 - SAMP</title><link rel='stylesheet' href='/static/samp.css'></head><body>
<header><h1>SAMP 采样服务</h1><p>定义采样来源、字段、周期和过滤条件</p><nav class='nav'><a class='active' href='/definitions'>采样定义</a><a href='/runtime'>运行监控</a><a href='/query'>采样查询</a></nav></header>
<main class='page'><div class='card overview-card'><div id='overview-metrics' class='status-row'><div class='metric'><b>--</b><span>采样定义</span></div><div class='metric'><b>--</b><span>已启用</span></div><div class='metric'><b>--</b><span>结果库</span></div><div class='metric'><b>--</b><span>调度状态</span></div></div></div>
<div class='toolbar'><h2>采样定义</h2><div><input id='definition-search' class='quick-search' placeholder='搜索采样点或源表'><select id='definition-status-filter' class='quick-filter'><option value='all'>全部状态</option><option value='enabled'>仅启用</option><option value='disabled'>仅停用</option></select><button id='new-definition' class='btn primary'>新建定义</button><button id='refresh-definitions' class='btn'>刷新</button></div></div>
<div class='grid'><form id='definition-form' class='card'><h2 id='form-title'>新建采样定义</h2><input type='hidden' id='definition-id'><div class='field'><label>采样点名</label><input id='name' required placeholder='例如：电表A'></div><div class='field'><label>源数据库</label><input id='source-database' required value='D:/codex/sqldb/realtime/samp/source.db'></div><div class='field'><label>源表</label><div style='display:flex;gap:6px'><input id='source-table' required list='source-table-options' placeholder='选择或输入真实表名'><button type='button' id='load-tables' class='btn'>读取表</button></div><datalist id='source-table-options'></datalist></div><div class='actions'><button type='button' id='inspect-source' class='btn'>读取字段和预览</button></div><div class='field'><label>采样字段 <span class='muted'>（可多选）</span></label><div class='actions compact'><button type='button' id='definition-fields-all' class='btn small'>全选</button><button type='button' id='definition-fields-none' class='btn small'>清空</button></div><div id='definition-fields' class='field-list'><span class='muted'>先读取源表字段</span></div></div><div class='field'><label>采样周期（秒，0 表示仅手动）</label><input id='interval' type='number' min='0' value='60' required></div><div class='field'><label>过滤条件（可选，例：status=1 and quality=0）</label><input id='filter' placeholder='留空表示采集全部行'></div><label class='field-check'><input id='enabled' type='checkbox' checked>启用自动采样</label><div class='actions'><button class='btn primary' type='submit'>保存定义</button><button class='btn' type='button' id='cancel-edit'>清空</button></div><div id='form-message' class='notice info'>保存前请读取源表并选择字段。</div></form><div class='card'><h2>源表预览</h2><div id='source-meta' class='muted'>尚未读取源表。</div><div id='source-preview' class='table-wrap preview'></div></div></div>
<div class='card' style='margin-top:18px'><div class='toolbar'><h2>已定义采样点</h2><span id='definition-count' class='muted'></span></div><div id='definition-table' class='table-wrap'></div></div></main><div id='toast' class='toast'></div>
<script src='/static/common.js'></script><script>
const state={definitions:[],source:null,definitionFilter:''};
function renderOverview(data){const scheduler=data.scheduler||{};$('overview-metrics').innerHTML=`<div class='metric'><b>${data.definitions||0}</b><span>采样定义</span></div><div class='metric'><b>${data.enabled||0}</b><span>已启用</span></div><div class='metric'><b>${data.result_databases||0}</b><span>结果库</span></div><div class='metric'><b>${scheduler.failed?'异常':'正常'}</b><span>调度状态</span></div>`}
function renderDefinitions(){const keyword=state.definitionFilter.trim().toLowerCase(),status=$('definition-status-filter').value,visible=state.definitions.filter(d=>(status==='all'||(status==='enabled'?d.enabled:!d.enabled))&&(!keyword||[d.samp_name,d.source_table,d.source_database].some(value=>String(value||'').toLowerCase().includes(keyword))));$('definition-count').textContent=keyword||status!=='all'?`显示 ${visible.length} / ${state.definitions.length} 个采样点`:`共 ${state.definitions.length} 个采样点`;if(!visible.length){$('definition-table').innerHTML=`<div class='empty'>${keyword||status!=='all'?'没有匹配的采样定义。':'暂无采样定义，请先新建。'}</div>`;return}$('definition-table').innerHTML=`<table class='data-table'><thead><tr><th>采样点</th><th>源数据库 / 源表</th><th>字段</th><th>周期</th><th>状态</th><th>操作</th></tr></thead><tbody>${visible.map(d=>`<tr><td><b>${esc(d.samp_name)}</b></td><td><div class='code'>${esc(d.source_database)}</div><div>${esc(d.source_table)}</div></td><td>${d.fields.map(esc).join(', ')}</td><td>${d.interval_seconds?d.interval_seconds+' 秒':'手动'}</td><td><span class='badge ${d.enabled?'on':'off'}'>${d.enabled?'运行中':'已停用'}</span></td><td><div class='actions'><button class='btn small' data-action='edit' data-id='${d.id}'>编辑</button><button class='btn small' data-action='copy' data-id='${d.id}'>复制</button><button class='btn small' data-action='sample' data-id='${d.id}'>立即采样</button><button class='btn small' data-action='toggle' data-id='${d.id}'>${d.enabled?'停用':'启用'}</button><button class='btn small danger' data-action='delete' data-id='${d.id}'>删除</button></div></td></tr>`).join('')}</tbody></table>`}
function renderPreview(data){$('source-meta').innerHTML=`<span class='code'>${esc(data.source_database)} : ${esc(data.source_table)}</span> · ${data.fields.length} 个字段 · 显示 ${data.rows.length} 行`;if(!data.rows.length){$('source-preview').innerHTML='<div class="empty">源表没有数据</div>';return}const cols=data.fields;$('source-preview').innerHTML=`<table class='data-table'><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${data.rows.map(row=>`<tr>${cols.map(c=>`<td>${esc(row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function inspectSource(){const db=$('source-database').value.trim(),table=$('source-table').value.trim();if(!db||!table){toast('请先填写源数据库和源表',true);return}try{const data=await api(`/api/source/inspect?source_database=${encodeURIComponent(db)}&source_table=${encodeURIComponent(table)}`);state.source=data;renderFieldChecks($('definition-fields'),data.fields,checkedFields($('definition-fields')));renderPreview(data);$('form-message').textContent='请选择要采样的字段后保存。'}catch(error){$('source-preview').innerHTML='';$('source-meta').textContent=error.message;toast(error.message,true)}}
async function loadTables(){const db=$('source-database').value.trim();if(!db){toast('请先填写源数据库',true);return}try{const data=await api(`/api/source/tables?source_database=${encodeURIComponent(db)}`);$('source-table-options').innerHTML=data.tables.map(t=>`<option value='${esc(t)}'>`).join('');if(data.tables.length){$('source-table').value=data.tables[0];await inspectSource()}toast(`读取到 ${data.tables.length} 张表`)}catch(error){toast(error.message,true)}}
function resetForm(){$('definition-id').value='';$('form-title').textContent='新建采样定义';$('name').value='';$('source-database').value='D:/codex/sqldb/realtime/samp/source.db';$('source-table').value='';$('definition-fields').innerHTML='<span class="muted">先读取源表字段</span>';$('source-meta').textContent='尚未读取源表。';$('source-preview').innerHTML='';$('interval').value='60';$('filter').value='';$('enabled').checked=true;$('form-message').textContent='保存前请读取源表并选择字段。'}
function editDefinition(def){$('definition-id').value=def.id;$('form-title').textContent=`编辑采样定义：${def.samp_name}`;$('name').value=def.samp_name;$('source-database').value=def.source_database;$('source-table').value=def.source_table;$('interval').value=def.interval_seconds;$('filter').value=def.filter||'';$('enabled').checked=!!def.enabled;inspectSource().then(()=>renderFieldChecks($('definition-fields'),state.source?.fields||[],def.fields));window.scrollTo({top:0,behavior:'smooth'})}
async function copyDefinition(def){if(!def)return;resetForm();$('name').value=`${def.samp_name}_副本`;$('source-database').value=def.source_database;$('source-table').value=def.source_table;$('interval').value=def.interval_seconds;$('filter').value=def.filter||'';$('enabled').checked=false;await inspectSource();renderFieldChecks($('definition-fields'),state.source?.fields||[],def.fields);$('form-message').textContent='已复制定义内容，请修改采样点名后保存。';window.scrollTo({top:0,behavior:'smooth'})}
async function saveDefinition(event){event.preventDefault();const fields=checkedFields($('definition-fields'));if(!fields.length){toast('至少选择一个采样字段',true);return}const payload={name:$('name').value.trim(),source_database:$('source-database').value.trim(),source_table:$('source-table').value.trim(),fields,interval_seconds:Number($('interval').value),filter:$('filter').value.trim(),enabled:$('enabled').checked},id=$('definition-id').value;try{await api(id?`/api/definitions/${id}`:'/api/definitions',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast(id?'采样定义已更新':'采样定义已创建');resetForm();await loadDefinitions()}catch(error){toast(error.message,true)}}
async function loadDefinitions(){try{state.definitions=await api('/api/definitions');renderDefinitions()}catch(error){toast(error.message,true)}}
async function loadAll(){try{const data=await api('/api/health');renderOverview(data)}catch(error){toast(error.message,true)}await loadDefinitions()}
async function toggleDefinition(id){const def=state.definitions.find(item=>item.id===id);if(!def)return;try{await api(`/api/definitions/${id}/enable?enabled=${!def.enabled}`,{method:'POST'});toast(def.enabled?'采样已停用':'采样已启用');await loadDefinitions()}catch(error){toast(error.message,true)}}
async function deleteDefinition(id){const def=state.definitions.find(item=>item.id===id);if(!def||!confirm(`确认删除采样点“${def.samp_name}”吗？`))return;try{await api(`/api/definitions/${id}`,{method:'DELETE'});toast('采样定义已删除');await loadDefinitions()}catch(error){toast(error.message,true)}}
async function sampleNow(id){try{const result=await api(`/api/sample/${id}`,{method:'POST'});toast(`采样完成，写入 ${result.rows_written} 行`)}catch(error){toast(error.message,true)}}
document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>document.querySelectorAll('.nav a').forEach(item=>item.classList.toggle('active',item===link))));$('definition-form').addEventListener('submit',saveDefinition);$('definition-status-filter').addEventListener('change',renderDefinitions);$('definition-search').addEventListener('input',event=>{state.definitionFilter=event.target.value;renderDefinitions()});$('new-definition').addEventListener('click',resetForm);$('cancel-edit').addEventListener('click',resetForm);$('refresh-definitions').addEventListener('click',loadAll);$('load-tables').addEventListener('click',loadTables);$('inspect-source').addEventListener('click',inspectSource);$('definition-fields-all').addEventListener('click',()=>setAllFields($('definition-fields'),true));$('definition-fields-none').addEventListener('click',()=>setAllFields($('definition-fields'),false));$('definition-table').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const id=Number(button.dataset.id),def=state.definitions.find(item=>item.id===id);if(button.dataset.action==='edit')editDefinition(def);if(button.dataset.action==='copy')copyDefinition(def);if(button.dataset.action==='delete')deleteDefinition(id);if(button.dataset.action==='toggle')toggleDefinition(id);if(button.dataset.action==='sample')sampleNow(id)});loadAll();setInterval(loadAll,15000);
</script></body></html>
