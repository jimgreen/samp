<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>采样定义 - SAMP</title>
  <script>
    (function(){
      var t = localStorage.getItem("samp_theme");
      var ok = ["minimalist-light","arctic-frost","warm-paper","slate-daylight","bento-grid","editorial","precision-dark","ocean-slate","nord-dark","industrial-amber","glassmorphism","sci-fi-cyan","sci-fi-purple","sci-fi-matrix"];
      var dark = ["precision-dark","ocean-slate","nord-dark","industrial-amber","glassmorphism","sci-fi-cyan","sci-fi-purple","sci-fi-matrix"];
      var theme = ok.indexOf(t) >= 0 ? t : "minimalist-light";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-color-scheme", dark.indexOf(theme) >= 0 ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/static/samp.css">
</head>
<body data-title-key="page.title.definitions">
<header class="topbar">
  <div class="topbar-left">
    <button type="button" class="btn ghost xs icon-only" id="btn-sidebar-toggle" data-sidebar-toggle data-i18n-title="sidebar.toggle">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
    <a class="brand" href="/definitions"><span class="brand-mark">S</span><span>SAMP</span></a>
    <span class="page-heading" data-i18n="nav.definitions">采样定义</span>
  </div>
  <div class="topbar-right">
    <span id="web-conn-status" class="conn-status" data-i18n="conn.checking">连接检查中</span>
    <button type="button" id="alarm-pill" class="alarm-pill hidden"></button>
    <a class="topbar-link" href="/docs" target="_blank" rel="noopener" data-i18n="nav.api_docs">接口文档 ↗</a>
    <div class="ui-global-controls">
      <select id="theme-select" class="select-ctrl ctrl-sm" data-i18n-title="theme.toggle">
        <option value="minimalist-light" data-i18n="theme.light">极简明亮</option>
        <option value="arctic-frost" data-i18n="theme.arctic">极地冰蓝</option>
        <option value="warm-paper" data-i18n="theme.warm">护眼暖纸</option>
        <option value="slate-daylight" data-i18n="theme.slate">冷灰工程</option>
        <option value="bento-grid" data-i18n="theme.bento">便当盒网格</option>
        <option value="editorial" data-i18n="theme.editorial">编辑杂志</option>
        <option value="precision-dark" data-i18n="theme.dark">精密暗黑</option>
        <option value="ocean-slate" data-i18n="theme.ocean">深海工业蓝</option>
        <option value="nord-dark" data-i18n="theme.nord">北欧极夜</option>
        <option value="industrial-amber" data-i18n="theme.amber">碳黑琥珀</option>
        <option value="glassmorphism" data-i18n="theme.glass">毛玻璃拟态</option>
        <option value="sci-fi-cyan" data-i18n="theme.cyan">科幻 · 电光青</option>
        <option value="sci-fi-purple" data-i18n="theme.purple">科幻 · 赛博紫</option>
        <option value="sci-fi-matrix" data-i18n="theme.matrix">科幻 · 矩阵绿</option>
      </select>
      <select id="lang-select" class="select-ctrl ctrl-sm" data-i18n-title="lang.label">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
        <option value="ru-RU">Русский</option>
      </select>
    </div>
  </div>
</header>

<div class="app-shell" id="app-shell">
  <aside class="sidebar">
    <div class="side-title" data-i18n="nav.group_config">采样配置</div>
    <nav class="sidebar-nav">
      <a class="active" href="/definitions" data-i18n-title="nav.definitions">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        <span data-i18n="nav.definitions">采样定义</span>
      </a>
      <div class="side-title" data-i18n="nav.group_monitor">监控与分析</div>
      <a href="/runtime" data-i18n-title="nav.runtime">
        <svg class="ico" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span data-i18n="nav.runtime">运行监控</span>
      </a>
      <a href="/query" data-i18n-title="nav.query">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span data-i18n="nav.query">采样查询</span>
      </a>
    </nav>
  </aside>
  <div class="sidebar-resizer" id="sidebar-resizer" data-i18n-title="sidebar.resize"></div>

  <div class="main-column">

  <section class="metric-strip" id="metric-strip">
    <div class="metric-item"><span class="metric-label" data-i18n="metric.definitions">定义</span><span class="metric-val" id="m-defs">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.enabled">启用</span><span class="metric-val ok" id="m-enabled">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.result_dbs">结果库</span><span class="metric-val" id="m-dbs">--</span></div>
    <div class="metric-item"><span class="dot" id="m-sched-dot"></span><span class="metric-label" data-i18n="metric.scheduler">调度</span><span class="metric-val" id="m-sched">--</span></div>
    <div class="metric-item"><span class="metric-label" data-i18n="metric.root_dir">根目录</span><span class="metric-val mono text-muted" id="m-root" style="font-weight:500">--</span></div>
  </section>

  <main class="workspace">
    <section class="panel grow">
      <div class="toolbar">
        <div class="toolbar-group">
          <input id="def-search" class="ctrl ctrl-search" data-i18n-placeholder="filter.search_def" placeholder="搜索采样点 / 源表 / 源库">
          <select id="def-status" class="select-ctrl">
            <option value="all" data-i18n="filter.all_status">全部状态</option>
            <option value="enabled" data-i18n="filter.only_enabled">仅启用</option>
            <option value="disabled" data-i18n="filter.only_disabled">仅停用</option>
          </select>
          <button type="button" id="batch-enable" class="btn hidden" data-i18n="action.batch_enable">批量启用</button>
          <button type="button" id="batch-disable" class="btn hidden" data-i18n="action.batch_disable">批量停用</button>
          <button type="button" id="batch-sample" class="btn hidden" data-i18n="action.batch_sample">批量采样</button>
          <button type="button" id="batch-delete" class="btn danger hidden" data-i18n="action.batch_delete">批量删除</button>
        </div>
        <div class="toolbar-group">
          <button type="button" id="btn-export-json" class="btn">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span data-i18n="def.export_json">导出 JSON</span>
          </button>
          <button type="button" id="btn-import-json" class="btn">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span data-i18n="def.import_json">导入 JSON</span>
          </button>
          <button type="button" id="btn-refresh" class="btn">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            <span data-i18n="action.refresh">刷新</span>
          </button>
          <button type="button" id="btn-table-sample" class="btn">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
            <span data-i18n="action.table_sample">整表采样</span>
          </button>
          <button type="button" id="btn-new" class="btn primary">
            <svg class="ico ico-xs" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="action.new">新建</span>
          </button>
        </div>
      </div>

      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:28px"><input type="checkbox" id="check-all"></th>
              <th data-i18n="col.name">采样点</th>
              <th data-i18n="col.source_table">源表</th>
              <th data-i18n="col.source_db">源数据库</th>
              <th data-i18n="col.target_db">目标库</th>
              <th data-i18n="col.fields">字段</th>
              <th data-i18n="col.start_mode">启动方式</th>
              <th data-i18n="col.filter">过滤</th>
              <th data-i18n="col.status">状态</th>
              <th data-i18n="col.last_sample">最近采样</th>
              <th class="sticky-actions" data-i18n="col.actions">操作</th>
            </tr>
          </thead>
          <tbody id="def-tbody">
            <tr><td colspan="11" class="empty-cell">—</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  </div>
</div>

<!-- 居中单点多采集项弹窗编辑器 -->
<div class="drawer-backdrop" id="drawer-backdrop">
  <form class="drawer" id="def-form">
    <div class="drawer-head">
      <h2 id="drawer-title" data-i18n="def.drawer_new">新建采样定义</h2>
      <button type="button" class="btn ghost xs" id="drawer-close" data-i18n="action.close">关闭</button>
    </div>

    <div class="drawer-body">
      <input type="hidden" id="f-id">
      <div class="warn-banner" id="rename-warn">
        <div data-i18n="def.rename_warn">修改采样点名或目标库将无法读取原路径的历史结果库。</div>
        <label class="field-pill" style="margin-top:6px;width:fit-content">
          <input type="checkbox" id="f-rename-migrate" checked>
          <span data-i18n="def.rename_migrate">同步迁移已有结果库</span>
        </label>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <div class="input-inline" style="justify-content:space-between">
            <label for="f-name" data-i18n="def.label_name">采样点名</label>
            <span id="f-name-hint" class="text-danger" style="font-size:11px"></span>
          </div>
          <input id="f-name" class="ctrl" required data-i18n-placeholder="def.ph_name" placeholder="如：电表A">
        </div>

        <div class="form-row" style="justify-content:flex-end">
          <label class="field-pill" style="height:28px;width:fit-content">
            <input type="checkbox" id="f-enabled" checked>
            <span data-i18n="def.label_enabled">启用自动采样</span>
          </label>
        </div>

        <div class="form-row span-2">
          <div class="schedule-box">
            <div class="schedule-head">
              <label style="font-size:11px;font-weight:600;color:var(--text-secondary)" data-i18n="col.start_mode">启动方式</label>
              <div class="tabs" id="start-mode-tabs">
                <button type="button" class="tab-btn active" data-start-mode="periodic" data-i18n="mode.periodic">周期采样</button>
                <button type="button" class="tab-btn" data-start-mode="fixed" data-i18n="mode.fixed">定点采样</button>
                <button type="button" class="tab-btn" data-start-mode="trigger" data-i18n="mode.trigger">触发采样</button>
              </div>
            </div>

            <!-- 1. 周期采样 -->
            <div id="sched-periodic" class="chip-row">
              <input id="f-interval" class="ctrl mono" type="number" min="0" value="60" style="width:76px" required>
              <div class="chip-row" id="period-chips">
                <button type="button" class="btn xs" data-period="0" data-i18n="state.manual">手动</button>
                <button type="button" class="btn xs" data-period="1">1s</button>
                <button type="button" class="btn xs" data-period="5">5s</button>
                <button type="button" class="btn xs" data-period="10">10s</button>
                <button type="button" class="btn xs" data-period="60">60s</button>
                <button type="button" class="btn xs" data-period="300">300s</button>
                <button type="button" class="btn xs" data-period="3600">3600s</button>
              </div>
            </div>

            <!-- 2. 定点采样（按时/日/周/月，支持多启动点，秒级精度） -->
            <div id="sched-fixed" class="hidden" style="display:flex;flex-direction:column;gap:6px">
              <div class="chip-row">
                <select id="fx-unit" class="select-ctrl" style="width:86px">
                  <option value="hour" data-i18n="fixed.hour">按时</option>
                  <option value="day" data-i18n="fixed.day" selected>按日</option>
                  <option value="week" data-i18n="fixed.week">按周</option>
                  <option value="month" data-i18n="fixed.month">按月</option>
                </select>
                <select id="fx-weekday" class="select-ctrl hidden" style="width:78px">
                  <option value="1" data-i18n="fixed.w1">周一</option>
                  <option value="2" data-i18n="fixed.w2">周二</option>
                  <option value="3" data-i18n="fixed.w3">周三</option>
                  <option value="4" data-i18n="fixed.w4">周四</option>
                  <option value="5" data-i18n="fixed.w5">周五</option>
                  <option value="6" data-i18n="fixed.w6">周六</option>
                  <option value="7" data-i18n="fixed.w7">周日</option>
                </select>
                <select id="fx-day" class="select-ctrl mono hidden" style="width:70px"></select>
                <div class="hms-group">
                  <input id="fx-hour" type="number" min="0" max="23" value="0" class="ctrl hms-num" title="HH">
                  <span id="fx-hour-sep" class="text-muted">:</span>
                  <input id="fx-minute" type="number" min="0" max="59" value="0" class="ctrl hms-num" title="MM">
                  <span class="text-muted">:</span>
                  <input id="fx-second" type="number" min="0" max="59" value="0" class="ctrl hms-num" title="SS">
                </div>
                <button type="button" id="btn-add-fixed-pt" class="btn xs primary" data-i18n="fixed.add_point">+ 时间点</button>
              </div>
              <div class="point-chips" id="fx-points-list"></div>
            </div>

            <!-- 3. 触发采样（内置/外部数据库标志位 + 阻塞/非阻塞 API） -->
            <div id="sched-trigger" class="hidden" style="display:flex;flex-direction:column;gap:6px">
              <div class="chip-row">
                <select id="tg-source" class="select-ctrl" style="min-width:168px">
                  <option value="builtin" data-i18n="trig.builtin">内置标志位 (trigger_flag)</option>
                  <option value="external" data-i18n="trig.external">外部数据库标志位</option>
                </select>
                <input id="tg-val" class="ctrl mono" style="width:70px" value="1" data-i18n-placeholder="trig.val" data-i18n-title="trig.val" placeholder="触发值">
                <input id="tg-reset" class="ctrl mono" style="width:70px" value="0" data-i18n-placeholder="trig.reset" data-i18n-title="trig.reset" placeholder="复位值">
                <label class="field-pill" style="height:26px">
                  <input type="checkbox" id="tg-auto-reset" checked>
                  <span data-i18n="trig.auto_reset">采样后自动复位</span>
                </label>
              </div>
              <div id="tg-builtin-hint" class="mono text-muted" style="font-size:11px"></div>
              <div id="tg-ext-row" class="chip-row hidden">
                <select id="tg-db" class="select-ctrl mono" style="flex:1.2 1 170px" data-i18n-title="trig.db"></select>
                <select id="tg-table" class="select-ctrl mono" style="flex:0.9 1 120px" data-i18n-title="trig.table"></select>
                <select id="tg-col" class="select-ctrl mono" style="flex:0.8 1 100px" data-i18n-title="trig.col"></select>
                <input id="tg-filter" class="ctrl mono" style="flex:1 1 110px" data-i18n-placeholder="trig.filter" placeholder="定位条件">
              </div>
            </div>
          </div>
        </div>

        <div class="form-row">
          <label for="f-target-dir-trigger" data-i18n="def.label_target_dir">目标目录</label>
          <div class="input-inline">
            <button type="button" id="f-target-dir-trigger" class="tree-trigger mono" aria-haspopup="tree" aria-expanded="false">
              <span class="tree-trigger-text">samp/</span>
              <svg class="ico ico-xs tree-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <input id="f-target-dir-custom" class="ctrl mono hidden" data-i18n-placeholder="def.ph_target_dir" placeholder="留空默认 samp">
          </div>
        </div>

        <div class="form-row">
          <div class="input-inline" style="justify-content:space-between">
            <label for="f-target-name" data-i18n="def.label_target_name">目标库名</label>
            <span id="f-target-preview" class="target-preview-chip" title="">—</span>
          </div>
          <input id="f-target-name" class="ctrl mono" data-i18n-placeholder="def.ph_target_name" placeholder="前缀 / name_{year}.db / 单库.db">
        </div>
      </div>

      <!-- 同采样点多采集项（一库多表）切换与增删 -->
      <div class="items-panel">
        <div class="items-panel-head">
          <label style="font-size:11px;font-weight:600;color:var(--text-secondary)">
            <span data-i18n="def.items_label">采集项</span>
            <span class="mono text-muted" id="items-count-badge">(1)</span>
          </label>
          <button type="button" id="btn-add-item" class="btn xs primary" data-i18n="def.item_add">+ 采集项</button>
        </div>
        <div class="items-strip" id="items-strip"></div>
      </div>

      <div class="form-grid">
        <div class="form-row span-2">
          <div class="input-inline" style="justify-content:space-between">
            <label for="f-source-dir-trigger" data-i18n="def.label_source_db">源数据库</label>
            <span id="f-root-hint" class="mono text-muted" style="font-size:11px"></span>
          </div>
          <div class="input-inline">
            <button type="button" id="f-source-dir-trigger" class="tree-trigger mono" style="flex:1.35 1 240px" aria-haspopup="tree" aria-expanded="false">
              <span class="tree-trigger-text">—</span>
              <svg class="ico ico-xs tree-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <select id="f-source-db-select" class="select-ctrl mono" style="flex:1 1 180px"></select>
            <input id="f-source-db-custom" class="ctrl mono hidden" placeholder="realtime/source.db">
            <button type="button" id="btn-load-tables" class="btn" data-i18n="action.load_tables">读表</button>
          </div>
        </div>

        <div class="form-row">
          <label for="f-source-table-select" data-i18n="def.label_source_table">源表</label>
          <div class="input-inline">
            <select id="f-source-table-select" class="select-ctrl mono"></select>
            <input id="f-source-table-custom" class="ctrl mono hidden" data-i18n-placeholder="def.ph_table" placeholder="选择或输入表名">
            <button type="button" id="btn-inspect" class="btn" data-i18n="action.preview">预览</button>
          </div>
        </div>

        <div class="form-row">
          <label for="f-target-table" data-i18n="def.label_target_table">目标表名</label>
          <input id="f-target-table" class="ctrl mono" data-i18n-placeholder="def.ph_target_table" placeholder="默认同库名/源表名">
        </div>

        <div class="form-row span-2">
          <div class="input-inline" style="justify-content:space-between">
            <label data-i18n="def.label_fields">采样字段</label>
            <div class="chip-row">
              <label class="field-pill" style="height:22px;padding:0 6px;font-size:11px">
                <input type="checkbox" id="f-all-fields">
                <span data-i18n="def.all_fields_wild">全表(*)</span>
              </label>
              <input id="f-field-search" class="ctrl ctrl-sm" style="width:104px" data-i18n-placeholder="def.ph_field_search" placeholder="筛选字段">
              <button type="button" id="btn-fields-num" class="btn xs" data-i18n="action.numeric_only">仅数值列</button>
              <button type="button" id="btn-fields-all" class="btn xs" data-i18n="action.select_all">全选</button>
              <button type="button" id="btn-fields-none" class="btn xs" data-i18n="action.clear">清空</button>
            </div>
          </div>
          <div id="f-fields" class="chip-row fields-scroll-box"></div>
        </div>

        <div class="form-row span-2">
          <label for="f-filter" data-i18n="def.label_filter">过滤条件</label>
          <div class="filter-builder">
            <select id="fb-field" class="select-ctrl mono" style="min-width:110px"></select>
            <select id="fb-op" class="select-ctrl mono" style="width:76px">
              <option value="=">=</option>
              <option value="!=">!=</option>
              <option value=">">&gt;</option>
              <option value=">=">&gt;=</option>
              <option value="<">&lt;</option>
              <option value="<=">&lt;=</option>
              <option value="in">in</option>
            </select>
            <input id="fb-val" class="ctrl mono" list="fb-val-list" style="flex:1 1 110px" data-i18n-placeholder="def.ph_cond_val" placeholder="值">
            <datalist id="fb-val-list"></datalist>
            <button type="button" id="btn-add-cond" class="btn xs" data-i18n="action.add_cond">加条件</button>
          </div>
          <div class="input-inline" style="margin-top:4px">
            <input id="f-filter" class="ctrl mono" data-i18n-placeholder="def.ph_filter" placeholder="status=1 and voltage>=200">
            <button type="button" id="btn-test-filter" class="btn" data-i18n="action.test_filter">试跑过滤</button>
          </div>
        </div>
      </div>

      <div class="preview-box">
        <div class="preview-head">
          <span><span data-i18n="def.preview_title">源表预览</span> · <span class="text-muted" data-i18n="def.click_cell_filter">点击单元格可加过滤</span></span>
          <span class="mono" id="preview-meta">—</span>
        </div>
        <div class="table-scroll" id="preview-wrap"></div>
      </div>
    </div>

    <div class="drawer-foot">
      <button type="button" class="btn" id="btn-cancel" data-i18n="action.cancel">取消</button>
      <button type="submit" class="btn" id="btn-save" data-i18n="action.save">保存</button>
      <button type="button" class="btn primary" id="btn-save-sample" data-i18n="action.save_and_sample">保存并采样</button>
    </div>
  </form>
</div>

<!-- 整表采样居中双栏配置弹窗（以表为单位：选字段/全表* + 过滤条件 + 预览 + 一键采样） -->
<div class="drawer-backdrop" id="ts-backdrop">
  <div class="drawer drawer-xl">
    <div class="drawer-head">
      <h2 data-i18n="def.ts_title">整表采样配置</h2>
      <button type="button" class="btn ghost xs" id="ts-close" data-i18n="action.close">关闭</button>
    </div>

    <div class="batch-bar">
      <button type="button" id="ts-source-dir-trigger" class="tree-trigger mono" style="flex:1 1 180px" aria-haspopup="tree" aria-expanded="false">
        <span class="tree-trigger-text">—</span>
        <svg class="ico ico-xs tree-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <select id="ts-source-db" class="select-ctrl mono" style="flex:0.85 1 150px"></select>
      <select id="ts-mode" class="select-ctrl">
        <option value="per_table" data-i18n="def.ts_mode_per_table">每表独立点</option>
        <option value="single_db" data-i18n="def.ts_mode_single_db">合并同库</option>
      </select>
      <input id="ts-bundle-name" type="text" class="ctrl mono hidden" style="width:126px" data-i18n-placeholder="def.ts_ph_bundle" placeholder="合并采样点名">
      <button type="button" id="ts-target-dir-trigger" class="tree-trigger mono" style="flex:0 1 150px" data-i18n-title="def.label_target_dir" aria-haspopup="tree" aria-expanded="false">
        <span class="tree-trigger-text">samp/</span>
        <svg class="ico ico-xs tree-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <input id="ts-default-period" type="number" min="0" value="60" class="ctrl mono" style="width:64px" data-i18n-title="def.label_interval">
      <select id="ts-conflict" class="select-ctrl">
        <option value="overwrite" data-i18n="def.import_overwrite">覆盖同名</option>
        <option value="skip" data-i18n="def.import_skip">跳过同名</option>
      </select>
      <label class="field-pill">
        <input type="checkbox" id="ts-enabled" checked>
        <span data-i18n="state.enabled">启用</span>
      </label>
    </div>

    <div class="ts-layout">
      <div class="ts-left">
        <div class="ts-left-head">
          <input type="checkbox" id="ts-check-all">
          <input type="text" id="ts-table-search" class="ctrl" data-i18n-placeholder="def.ts_search_table" placeholder="筛选表名">
        </div>
        <div class="ts-table-list" id="ts-table-list">
          <div class="empty-cell">—</div>
        </div>
      </div>

      <div class="ts-right" id="ts-right">
        <div class="form-grid">
          <div class="form-row">
            <label for="ts-point-name" data-i18n="def.label_name">采样点名</label>
            <input id="ts-point-name" class="ctrl mono" placeholder="table_name">
          </div>
          <div class="form-row">
            <label for="ts-period" data-i18n="def.label_interval">周期 (s)</label>
            <input id="ts-period" type="number" min="0" value="60" class="ctrl mono">
          </div>

          <div class="form-row span-2">
            <div class="input-inline" style="justify-content:space-between">
              <label data-i18n="def.label_fields">采样字段</label>
              <div class="chip-row">
                <label class="field-pill" style="height:22px;padding:0 6px;font-size:11px">
                  <input type="checkbox" id="ts-all-fields" checked>
                  <span data-i18n="def.all_fields_wild">全表(*)</span>
                </label>
                <input id="ts-field-search" class="ctrl ctrl-sm" style="width:100px" data-i18n-placeholder="def.ph_field_search" placeholder="筛选字段">
                <button type="button" id="ts-fields-num" class="btn xs" data-i18n="action.numeric_only">仅数值列</button>
                <button type="button" id="ts-fields-all" class="btn xs" data-i18n="action.select_all">全选</button>
                <button type="button" id="ts-fields-none" class="btn xs" data-i18n="action.clear">清空</button>
              </div>
            </div>
            <div id="ts-fields" class="chip-row fields-scroll-box"></div>
          </div>

          <div class="form-row span-2">
            <label for="ts-filter" data-i18n="def.label_filter">过滤条件</label>
            <div class="filter-builder">
              <select id="ts-fb-field" class="select-ctrl mono" style="min-width:110px"></select>
              <select id="ts-fb-op" class="select-ctrl mono" style="width:74px">
                <option value="=">=</option>
                <option value="!=">!=</option>
                <option value=">">&gt;</option>
                <option value=">=">&gt;=</option>
                <option value="<">&lt;</option>
                <option value="<=">&lt;=</option>
                <option value="in">in</option>
              </select>
              <input id="ts-fb-val" class="ctrl mono" list="ts-fb-val-list" style="flex:1 1 100px" data-i18n-placeholder="def.ph_cond_val" placeholder="值">
              <datalist id="ts-fb-val-list"></datalist>
              <button type="button" id="ts-add-cond" class="btn xs" data-i18n="action.add_cond">加条件</button>
            </div>
            <div class="input-inline" style="margin-top:4px">
              <input id="ts-filter" class="ctrl mono" data-i18n-placeholder="def.ph_filter" placeholder="status=1 and voltage>=200">
              <button type="button" id="ts-test-filter" class="btn" data-i18n="action.test_filter">试跑过滤</button>
            </div>
          </div>
        </div>

        <div class="preview-box" style="flex:1 1 auto;max-height:none;min-height:130px">
          <div class="preview-head">
            <span><span data-i18n="def.preview_title">源表预览</span> · <span class="text-muted" data-i18n="def.click_cell_filter">点击单元格可加过滤</span></span>
            <span class="mono" id="ts-preview-meta">—</span>
          </div>
          <div class="table-scroll" id="ts-preview-wrap"></div>
        </div>
      </div>
    </div>

    <div class="drawer-foot" style="justify-content:space-between">
      <span class="mono text-muted" id="ts-foot-meta">—</span>
      <div class="toolbar-group">
        <button type="button" class="btn" id="ts-cancel" data-i18n="action.cancel">取消</button>
        <button type="button" class="btn" id="ts-save" disabled>保存 (0)</button>
        <button type="button" class="btn primary" id="ts-save-run" disabled>保存并采样 (0)</button>
      </div>
    </div>
  </div>
</div>

<!-- 导入 JSON 模态框 -->
<div class="modal-backdrop" id="import-backdrop">
  <form class="modal modal-accent" id="import-form">
    <div class="modal-head" data-i18n="def.import_title">批量导入采样定义</div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px">
      <div class="form-row">
        <label for="import-file" data-i18n="def.import_file">JSON 文件</label>
        <input type="file" id="import-file" accept=".json,application/json" class="ctrl" style="padding-top:3px" required>
      </div>
      <div class="form-row">
        <label for="import-mode" data-i18n="def.import_mode">同名策略</label>
        <select id="import-mode" class="select-ctrl">
          <option value="skip" data-i18n="def.import_skip">跳过同名</option>
          <option value="overwrite" data-i18n="def.import_overwrite">覆盖同名</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" id="import-cancel" data-i18n="action.cancel">取消</button>
      <button type="submit" class="btn primary" data-i18n="action.confirm">确认</button>
    </div>
  </form>
</div>

<div id="toast" class="toast"></div>
<script src="/static/i18n.js"></script>
<script src="/static/common.js"></script>
<script src="/static/definitions.js"></script>
</body>
</html>
